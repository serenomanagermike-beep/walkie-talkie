<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Direct Connect Walkie-Talkie</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px;
    }
    .header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: #58a6ff; text-align: center; }
    
    .screen {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 12px 16px;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 8px;
      background: #21262d;
      color: #8b949e;
    }
    .status-badge.tx { background: #da3633; color: #fff; }
    .status-badge.rx { background: #238636; color: #fff; }

    .channel-select {
      background: #0d1117;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      font-weight: bold;
      outline: none;
    }

    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .ptt-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #30363d;
      background: radial-gradient(circle, #21262d 0%, #161b22 100%);
      color: #8b949e;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      touch-action: none;
      transition: all 0.1s ease;
    }
    .ptt-btn.active {
      border-color: #f85149;
      background: radial-gradient(circle, #da3633 0%, #b62324 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(218, 54, 51, 0.6);
      transform: scale(0.96);
    }

    .power-btn {
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      width: 100%;
      max-width: 360px;
      cursor: pointer;
    }
    .power-btn.off { background-color: #da3633; }

    .log-box {
      width: 100%;
      max-width: 360px;
      height: 70px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #3fb950;
      padding: 6px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DIRECT CONNECT</h1>
  </div>

  <div class="screen">
    <div id="statusBadge" class="status-badge">RADIO OFF</div>
    <select id="channelSelect" class="channel-select">
      <option value="room-alpha-direct">CHANNEL 1</option>
      <option value="room-bravo-direct">CHANNEL 2</option>
      <option value="room-charlie-direct">CHANNEL 3</option>
    </select>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">PTT</div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">System ready. Tap Power On.</div>

  <div id="audioContainer"></div>

  <script>
    const myId = "ptt-" + Math.floor(Math.random() * 899999 + 100000);
    let peer = null;
    let localStream = null;
    let activeCalls = {};
    let isPoweredOn = false;
    let isTransmitting = false;
    let syncInterval = null;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const channelSelect = document.getElementById("channelSelect");
    const logBox = document.getElementById("logBox");
    const audioContainer = document.getElementById("audioContainer");

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChirp() {
      try {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(2400, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    async function togglePower() {
      if (audioCtx.state === "suspended") await audioCtx.resume();

      if (!isPoweredOn) {
        powerBtn.innerText = "CONNECTING...";
        powerBtn.disabled = true;
        log("Accessing microphone...");

        try {
          // 1. Get Live Mic Stream
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          // Mute mic tracks by default (Standby)
          localStream.getAudioTracks().forEach(track => track.enabled = false);
          log("Microphone ready (Muted/RX).");

          // 2. Initialize PeerJS connection
          peer = new Peer(myId);

          peer.on("open", (id) => {
            isPoweredOn = true;
            powerBtn.innerText = "POWER OFF";
            powerBtn.className = "power-btn off";
            powerBtn.disabled = false;
            channelSelect.disabled = true;
            statusBadge.innerText = "RX STANDBY";
            statusBadge.className = "status-badge rx";
            log("Radio Online ID: " + id);

            // Announce presence via signaling mesh
            joinChannelMesh();
          });

          // Handle incoming audio call
          peer.on("call", (call) => {
            log("Connected to peer: " + call.peer);
            call.answer(localStream);
            attachAudioStream(call);
          });

          peer.on("error", (err) => {
            log("Radio error: " + err.type);
          });

        } catch (err) {
          alert("Microphone required: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        // Disconnect & Reset
        if (syncInterval) clearInterval(syncInterval);
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
          localStream = null;
        }
        if (peer) peer.destroy();
        audioContainer.innerHTML = "";
        activeCalls = {};
        isPoweredOn = false;
        powerBtn.innerText = "POWER ON RADIO";
        powerBtn.className = "power-btn";
        channelSelect.disabled = false;
        statusBadge.innerText = "RADIO OFF";
        statusBadge.className = "status-badge";
        log("Radio powered down.");
      }
    }

    function attachAudioStream(call) {
      activeCalls[call.peer] = call;
      call.on("stream", (remoteStream) => {
        let audio = document.getElementById("audio-" + call.peer);
        if (!audio) {
          audio = document.createElement("audio");
          audio.id = "audio-" + call.peer;
          audio.autoplay = true;
          audio.setAttribute("playsinline", "true");
          audioContainer.appendChild(audio);
        }
        audio.srcObject = remoteStream;
        audio.play().catch(() => {});
        log("Audio pipeline active for " + call.peer);
      });

      call.on("close", () => {
        const el = document.getElementById("audio-" + call.peer);
        if (el) el.remove();
        delete activeCalls[call.peer];
      });
    }

    // Dynamic Peer Discovery via Open Sync Relay
    function joinChannelMesh() {
      const room = channelSelect.value;
      const syncUrl = `https://ntfy.sh/directconnect-${room}`;

      // Announce identity
      fetch(`${syncUrl}/publish`, {
        method: "POST",
        body: JSON.stringify({ action: "join", id: myId })
      }).catch(() => {});

      // Listen for other radios joining
      const eventSource = new EventSource(`${syncUrl}/sse`);
      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const message = JSON.parse(data.message);
          if (message.id && message.id !== myId) {
            if (message.action === "join" && !activeCalls[message.id]) {
              log("Calling peer: " + message.id);
              const call = peer.call(message.id, localStream);
              if (call) attachAudioStream(call);
            }
          }
        } catch (e) {}
      };

      // Periodic heartbeat sync
      syncInterval = setInterval(() => {
        if (!isPoweredOn) return;
        fetch(`${syncUrl}/publish`, {
          method: "POST",
          body: JSON.stringify({ action: "join", id: myId })
        }).catch(() => {});
      }, 8000);
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting || !localStream) return;
      isTransmitting = true;
      playChirp();
      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";

      // Unmute live audio track directly in WebRTC pipeline
      localStream.getAudioTracks().forEach(t => t.enabled = true);
      log("TX Live (Mic Unmuted)");
    }

    function stopTransmit() {
      if (!isTransmitting || !localStream) return;
      isTransmitting = false;
      pttBtn.classList.remove("active");
      statusBadge.innerText = "RX STANDBY";
      statusBadge.className = "status-badge rx";

      // Mute audio track
      localStream.getAudioTracks().forEach(t => t.enabled = false);
      log("RX Standby (Mic Muted)");
    }

    powerBtn.addEventListener("click", togglePower);

    // Mobile touch controls
    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTransmit(); });

    // Desktop/Laptop controls
    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
</body>
</html>
