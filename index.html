<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mic Hardware Diagnostic</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: monospace;
      padding: 20px;
      text-align: center;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }
    #meter {
      width: 100%;
      height: 30px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
    }
    #meterFill {
      width: 0%;
      height: 100%;
      background: #3fb950;
      transition: width 0.05s linear;
    }
    #log {
      background: #000;
      color: #58a6ff;
      padding: 12px;
      border-radius: 6px;
      text-align: left;
      height: 160px;
      overflow-y: auto;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h2>HARDWARE MIC TEST</h2>
  <button id="testBtn">TEST MICROPHONE</button>

  <div id="meter">
    <div id="meterFill"></div>
  </div>

  <div id="log">> Tap TEST MICROPHONE to inspect hardware...</div>

  <script>
    const btn = document.getElementById('testBtn');
    const meterFill = document.getElementById('meterFill');
    const logBox = document.getElementById('log');

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.innerText = "TESTING...";
      log("Checking browser mediaDevices...");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log("FATAL: getUserMedia not supported in this browser context.");
        return;
      }

      try {
        log("Requesting plain unconstrained mic stream...");
        // Bare-metal audio request - zero filters/processing
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        
        const audioTracks = stream.getAudioTracks();
        if (audioTracks.length === 0) {
          log("ERROR: Stream returned with 0 audio tracks.");
          return;
        }

        const track = audioTracks[0];
        log(`Track Label: ${track.label}`);
        log(`Track ReadyState: ${track.readyState}`);
        log(`Track Muted Flag: ${track.muted}`);

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }
        log(`AudioContext State: ${ctx.state}, SampleRate: ${ctx.sampleRate}Hz`);

        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 128;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function draw() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          let avg = sum / dataArray.length;
          let pct = Math.min(100, Math.round((avg / 128) * 100));

          meterFill.style.width = pct + "%";
          if (pct > 5) {
            meterFill.style.background = "#3fb950";
          } else {
            meterFill.style.background = "#da3633";
          }

          requestAnimationFrame(draw);
        }

        draw();
        btn.innerText = "MIC ACTIVE";
        btn.style.background = "#8957e5";
        log("Pipeline running. Speak into mic now!");

      } catch (err) {
        log(`MIC ACCESS FAILED: ${err.name} - ${err.message}`);
        btn.disabled = false;
        btn.innerText = "TEST MICROPHONE";
      }
    });
  </script>
</body>
</html>
