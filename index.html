<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Direct Connect Walkie-Talkie</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px;
    }
    .header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: #58a6ff; text-align: center; }
    
    .screen {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 12px 16px;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 8px;
      background: #21262d;
      color: #8b949e;
    }
    .status-badge.tx { background: #da3633; color: #fff; }
    .status-badge.rx { background: #238636; color: #fff; }

    .channel-select {
      background: #0d1117;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      font-weight: bold;
      outline: none;
    }

    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .ptt-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #30363d;
      background: radial-gradient(circle, #21262d 0%, #161b22 100%);
      color: #8b949e;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      touch-action: none;
      transition: all 0.1s ease;
    }
    .ptt-btn.active {
      border-color: #f85149;
      background: radial-gradient(circle, #da3633 0%, #b62324 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(218, 54, 51, 0.6);
      transform: scale(0.96);
    }

    .power-btn {
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      width: 100%;
      max-width: 360px;
      cursor: pointer;
    }
    .power-btn.off { background-color: #da3633; }

    /* On-Screen Activity Log */
    .log-box {
      width: 100%;
      max-width: 360px;
      height: 65px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #3fb950;
      padding: 6px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DIRECT CONNECT</h1>
  </div>

  <div class="screen">
    <div id="statusBadge" class="status-badge">RADIO OFF</div>
    <select id="channelSelect" class="channel-select">
      <option value="room-alpha-99">CHANNEL 1</option>
      <option value="room-bravo-99">CHANNEL 2</option>
      <option value="room-charlie-99">CHANNEL 3</option>
    </select>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">PTT</div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">Radio standby. Click Power On.</div>

  <audio id="remoteAudioPlayer" playsinline></audio>

  <script>
    const myId = "radio-" + Math.floor(Math.random() * 100000);
    let mqttClient = null;
    let localStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isPoweredOn = false;
    let isTransmitting = false;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const channelSelect = document.getElementById("channelSelect");
    const logBox = document.getElementById("logBox");
    const remoteAudioPlayer = document.getElementById("remoteAudioPlayer");

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    // Audio synthesizer for Nextel chirp
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChirp() {
      try {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(2400, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    async function togglePower() {
      if (audioCtx.state === "suspended") await audioCtx.resume();

      // Crucial: Unlock mobile audio playback engine on user click
      remoteAudioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
      remoteAudioPlayer.play().catch(() => {});

      if (!isPoweredOn) {
        powerBtn.innerText = "CONNECTING...";
        powerBtn.disabled = true;
        log("Requesting mic permission...");

        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          log("Mic active. Connecting server...");

          mqttClient = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
            clientId: myId,
            clean: true,
            reconnectPeriod: 2000
          });

          mqttClient.on("connect", () => {
            const topic = "directconnect/ptt/" + channelSelect.value;
            mqttClient.subscribe(topic);
            isPoweredOn = true;
            powerBtn.innerText = "POWER OFF";
            powerBtn.className = "power-btn off";
            powerBtn.disabled = false;
            channelSelect.disabled = true;
            statusBadge.innerText = "RX STANDBY";
            statusBadge.className = "status-badge rx";
            log("Connected to Channel 1. Ready.");
          });

          mqttClient.on("message", (topic, message) => {
            try {
              const packet = JSON.parse(message.toString());
              if (packet.sender === myId) return;

              if (packet.audio) {
                log("Incoming audio (" + Math.round(packet.audio.length / 1024) + " KB)...");
                statusBadge.innerText = "INCOMING RX...";
                statusBadge.className = "status-badge rx";

                remoteAudioPlayer.src = "data:audio/webm;base64," + packet.audio;
                remoteAudioPlayer.play().then(() => {
                  log("Audio playing.");
                }).catch(err => {
                  log("Play error: " + err.message);
                });

                remoteAudioPlayer.onended = () => {
                  if (!isTransmitting) {
                    statusBadge.innerText = "RX STANDBY";
                    statusBadge.className = "status-badge rx";
                    log("RX completed. Standby.");
                  }
                };
              }
            } catch (e) {
              log("Parse error");
            }
          });

        } catch (err) {
          alert("Mic error: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }
        if (mqttClient) mqttClient.end();
        isPoweredOn = false;
        powerBtn.innerText = "POWER ON RADIO";
        powerBtn.className = "power-btn";
        channelSelect.disabled = false;
        statusBadge.innerText = "RADIO OFF";
        statusBadge.className = "status-badge";
        log("Radio powered down.");
      }
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting || !localStream) return;
      isTransmitting = true;
      playChirp();
      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";
      log("TX recording...");

      audioChunks = [];
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") 
        ? "audio/webm;codecs=opus" 
        : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "audio/webm");

      mediaRecorder = new MediaRecorder(localStream, { mimeType: mime });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: mime });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = () => {
          const base64Audio = reader.result.split(",")[1];
          const topic = "directconnect/ptt/" + channelSelect.value;
          mqttClient.publish(topic, JSON.stringify({
            sender: myId,
            audio: base64Audio
          }));
          log("Sent " + Math.round(base64Audio.length / 1024) + " KB audio.");
        };
      };

      mediaRecorder.start();
    }

    function stopTransmit() {
      if (!isTransmitting || !mediaRecorder) return;
      isTransmitting = false;
      pttBtn.classList.remove("active");
      statusBadge.innerText = "RX STANDBY";
      statusBadge.className = "status-badge rx";

      if (mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
    }

    powerBtn.addEventListener("click", togglePower);

    // Mobile touch events
    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTransmit(); });

    // PC/Laptop mouse events
    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
</body>
</html>
