<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Direct Connect Walkie-Talkie</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px;
    }
    .header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: #58a6ff; text-align: center; }
    
    .screen {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 12px 16px;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 8px;
      background: #21262d;
      color: #8b949e;
    }
    .status-badge.tx { background: #da3633; color: #fff; }
    .status-badge.rx { background: #238636; color: #fff; }

    .channel-select {
      background: #0d1117;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      font-weight: bold;
      outline: none;
      margin-bottom: 8px;
    }

    .meter-container {
      width: 100%;
      height: 12px;
      background: #0d1117;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #30363d;
    }
    .meter-bar {
      width: 0%;
      height: 100%;
      background: #3fb950;
      transition: width 0.05s linear;
    }

    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .ptt-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #30363d;
      background: radial-gradient(circle, #21262d 0%, #161b22 100%);
      color: #8b949e;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      touch-action: none;
      transition: all 0.1s ease;
    }
    .ptt-btn.active {
      border-color: #f85149;
      background: radial-gradient(circle, #da3633 0%, #b62324 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(218, 54, 51, 0.6);
      transform: scale(0.96);
    }

    .power-btn {
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      width: 100%;
      max-width: 360px;
      cursor: pointer;
    }
    .power-btn.off { background-color: #da3633; }

    .log-box {
      width: 100%;
      max-width: 360px;
      height: 80px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #3fb950;
      padding: 6px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DIRECT CONNECT</h1>
  </div>

  <div class="screen">
    <div id="statusBadge" class="status-badge">RADIO OFF</div>
    <select id="channelSelect" class="channel-select">
      <option value="room-alpha-direct">CHANNEL 1</option>
      <option value="room-bravo-direct">CHANNEL 2</option>
      <option value="room-charlie-direct">CHANNEL 3</option>
    </select>
    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">PTT</div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">System ready. Tap Power On.</div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const myId = "ptt-" + Math.floor(Math.random() * 899999 + 100000);
    let peer = null;
    let micStream = null;
    let outboundStream = null;
    let audioCtx = null;
    let pttGain = null;
    let analyser = null;
    let animId = null;

    let activeCall = null;
    let isPoweredOn = false;
    let isTransmitting = false;
    let syncInterval = null;
    let eventSource = null;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const channelSelect = document.getElementById("channelSelect");
    const logBox = document.getElementById("logBox");
    const meterBar = document.getElementById("meterBar");
    const remoteAudio = document.getElementById("remoteAudio");

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    function playChirp() {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(2400, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    async function togglePower() {
      if (!isPoweredOn) {
        powerBtn.innerText = "CONNECTING...";
        powerBtn.disabled = true;
        log("Accessing microphone...");

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
          if (audioCtx.state === "suspended") {
            await audioCtx.resume();
          }

          // 1. Bare-metal capture proven by hardware test
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

          // 2. Build Web Audio routing graph
          const micSource = audioCtx.createMediaStreamSource(micStream);
          
          // Visual VU Meter
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          micSource.connect(analyser);

          // PTT Gain Muting (starts at 0.0 in RX Standby)
          pttGain = audioCtx.createGain();
          pttGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
          micSource.connect(pttGain);

          const destination = audioCtx.createMediaStreamDestination();
          pttGain.connect(destination);
          outboundStream = destination.stream;

          // Start visual meter loop
          const dataArray = new Uint8Array(analyser.frequencyBinCount);
          function drawMeter() {
            if (!isPoweredOn) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let pct = Math.min(100, Math.round((avg / 128) * 100));

            if (isTransmitting) {
              meterBar.style.width = pct + "%";
              meterBar.style.backgroundColor = "#da3633";
            } else {
              meterBar.style.width = Math.min(25, pct / 2) + "%";
              meterBar.style.backgroundColor = "#238636";
            }
            animId = requestAnimationFrame(drawMeter);
          }
          drawMeter();

          // 3. Initialize PeerJS with public STUN
          peer = new Peer(myId, {
            debug: 1,
            config: {
              iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" }
              ],
              iceCandidatePoolSize: 10
            }
          });

          peer.on("open", (id) => {
            isPoweredOn = true;
            powerBtn.innerText = "POWER OFF";
            powerBtn.className = "power-btn off";
            powerBtn.disabled = false;
            channelSelect.disabled = true;
            statusBadge.innerText = "RX STANDBY";
            statusBadge.className = "status-badge rx";
            log("Radio Online ID: " + id);

            joinChannelMesh();
          });

          peer.on("call", (call) => {
            log("Inbound link from: " + call.peer);
            call.answer(outboundStream);
            attachStream(call);
          });

          peer.on("error", (err) => {
            log("Peer error: " + err.type);
          });

        } catch (err) {
          alert("Microphone required: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        if (syncInterval) clearInterval(syncInterval);
        if (eventSource) eventSource.close();
        if (animId) cancelAnimationFrame(animId);
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (audioCtx) {
          audioCtx.close();
          audioCtx = null;
        }
        if (peer) peer.destroy();
        remoteAudio.srcObject = null;
        activeCall = null;
        isPoweredOn = false;
        powerBtn.innerText = "POWER ON RADIO";
        powerBtn.className = "power-btn";
        channelSelect.disabled = false;
        statusBadge.innerText = "RADIO OFF";
        statusBadge.className = "status-badge";
        meterBar.style.width = "0%";
        log("Radio powered down.");
      }
    }

    function attachStream(call) {
      activeCall = call;

      call.on("stream", (stream) => {
        log("Remote audio pipeline connected.");
        remoteAudio.srcObject = stream;
        remoteAudio.volume = 1.0;
        remoteAudio.play().catch(() => {
          log("Tap screen to unmute incoming audio.");
        });
      });

      call.on("close", () => {
        log("Remote peer disconnected.");
        remoteAudio.srcObject = null;
        activeCall = null;
      });
    }

    function joinChannelMesh() {
      const room = channelSelect.value;
      const syncUrl = `https://ntfy.sh/directconnect-${room}`;

      fetch(`${syncUrl}/publish`, {
        method: "POST",
        body: JSON.stringify({ action: "join", id: myId })
      }).catch(() => {});

      if (eventSource) eventSource.close();
      eventSource = new EventSource(`${syncUrl}/sse`);
      
      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const message = JSON.parse(data.message);
          
          if (message.id && message.id !== myId && message.action === "join") {
            if (!activeCall && myId > message.id) {
              log("Calling peer: " + message.id);
              const call = peer.call(message.id, outboundStream);
              if (call) attachStream(call);
            }
          }
        } catch (e) {}
      };

      syncInterval = setInterval(() => {
        if (!isPoweredOn) return;
        fetch(`${syncUrl}/publish`, {
          method: "POST",
          body: JSON.stringify({ action: "join", id: myId })
        }).catch(() => {});
      }, 8000);
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting || !pttGain || !audioCtx) return;
      isTransmitting = true;
      if (audioCtx.state === "suspended") audioCtx.resume();
      
      playChirp();
      
      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";

      // Unmute WebRTC transmission stream instantly
      pttGain.gain.cancelScheduledValues(audioCtx.currentTime);
      pttGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      log("TX Live (Mic Active)");
    }

    function stopTransmit() {
      if (!isTransmitting || !pttGain || !audioCtx) return;
      isTransmitting = false;
      
      pttBtn.classList.remove("active");
      statusBadge.innerText = "RX STANDBY";
      statusBadge.className = "status-badge rx";

      // Mute WebRTC transmission stream instantly
      pttGain.gain.cancelScheduledValues(audioCtx.currentTime);
      pttGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
      log("RX Standby");
    }

    powerBtn.addEventListener("click", togglePower);

    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTransmit(); });

    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
</body>
</html>
