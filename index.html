<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Friend Radio</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at top, #161f30 0%, #090d16 100%);
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 12px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      max-width: 380px;
      text-align: center;
      padding-top: 2px;
    }
    .header h1 {
      font-size: 1.3rem;
      letter-spacing: 3px;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .header .tagline {
      font-size: 0.68rem;
      color: #64748b;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .screen {
      background: #0b1120;
      border: 2px solid #1e293b;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8), 0 4px 16px rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 10px 12px;
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-bottom: 6px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .status-badge.tx {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.6);
      border-color: #f87171;
    }
    .status-badge.rx {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.6);
      animation: pulse 0.6s infinite alternate;
      border-color: #34d399;
    }
    .status-badge.online {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
      border-color: #38bdf8;
    }

    @keyframes pulse {
      from { opacity: 0.7; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    .user-tag {
      font-size: 0.8rem;
      font-weight: 800;
      color: #38bdf8;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 4px;
      margin-bottom: 8px;
    }

    .contacts-label {
      font-size: 0.68rem;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-align: left;
      font-weight: bold;
    }
    .contacts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .contact-btn {
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 7px 6px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .contact-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .contact-btn.talkall {
      grid-column: span 2;
      background: #1e293b;
      border-color: #475569;
    }
    .contact-btn.talkall.active {
      background: #2563eb;
      border-color: #60a5fa;
    }

    .meter-container {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    .meter-bar {
      width: 0%;
      height: 100%;
      background: #10b981;
      transition: width 0.05s ease;
    }

    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 6px 0;
    }
    .ptt-btn {
      width: 155px;
      height: 155px;
      border-radius: 50%;
      border: 7px solid #1e293b;
      background: radial-gradient(circle at 35% 35%, #334155 0%, #0f172a 100%);
      color: #94a3b8;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.1);
      cursor: pointer;
      touch-action: none;
      transition: all 0.1s ease;
    }
    .ptt-btn span {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #64748b;
      margin-top: 2px;
    }
    .ptt-btn.active {
      border-color: #ef4444;
      background: radial-gradient(circle at 35% 35%, #ef4444 0%, #b91c1c 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.7), inset 0 2px 6px rgba(255, 255, 255, 0.2);
      transform: scale(0.96);
    }
    .ptt-btn.active span {
      color: #fee2e2;
    }

    .power-btn {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: 1px solid #34d399;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      width: 100%;
      max-width: 380px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.15s ease;
    }
    .power-btn:active {
      transform: scale(0.98);
    }
    .power-btn.off {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      border-color: #f87171;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    }

    .log-box {
      width: 100%;
      max-width: 380px;
      height: 65px;
      background: #050811;
      border: 1px solid #1e293b;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.7rem;
      color: #38bdf8;
      padding: 6px 8px;
      overflow-y: auto;
      text-align: left;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>FRIEND RADIO</h1>
    <div class="tagline">Direct Connect PTT</div>
  </div>

  <div class="screen">
    <div id="statusBadge" class="status-badge">RADIO OFF</div>
    
    <div id="userTag" class="user-tag">RADIO ID: LOCKING...</div>

    <div class="contacts-label">Direct Calling Target:</div>
    <div class="contacts-grid">
      <button class="contact-btn talkall active" data-target="talkall">📢 Talk All (Broadcast)</button>
      <button class="contact-btn" data-target="jim">California Jim</button>
      <button class="contact-btn" data-target="edd">Edd</button>
      <button class="contact-btn" data-target="matt">Minnesota Matt</button>
      <button class="contact-btn" data-target="work">Work Test Phone</button>
      <button class="contact-btn" data-target="mike">Mike</button>
    </div>

    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">
      PTT
      <span id="pttTargetLabel">TALK ALL</span>
    </div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">Tap Power On to connect.</div>

  <script>
    const userMap = {
      "jim": "California Jim",
      "edd": "Edd",
      "matt": "Minnesota Matt",
      "work": "Work Test Phone",
      "mike": "Mike"
    };

    // Read identity from URL, fallback to stored device ID, or default to work
    const urlParams = new URLSearchParams(window.location.search);
    const urlUser = urlParams.get("user");
    
    let myId = urlUser || localStorage.getItem("fr_my_id") || "work";
    if (urlUser) {
      localStorage.setItem("fr_my_id", myId);
    }

    const myDisplayName = userMap[myId] || "Authorized User";
    document.getElementById("userTag").innerText = `📻 USER: ${myDisplayName.toUpperCase()}`;

    let selectedTarget = "talkall";
    let mqttClient = null;
    let micStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let micAnalyser = null;
    let meterInterval = null;
    let isPoweredOn = false;
    let isTransmitting = false;
    let wakeLock = null;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const pttTargetLabel = document.getElementById("pttTargetLabel");
    const logBox = document.getElementById("logBox");
    const meterBar = document.getElementById("meterBar");
    const contactBtns = document.querySelectorAll(".contact-btn");

    contactBtns.forEach(btn => {
      // Hide own name from target list
      if (btn.getAttribute("data-target") === myId) {
        btn.style.display = "none";
      }

      btn.addEventListener("click", () => {
        contactBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedTarget = btn.getAttribute("data-target");

        if (selectedTarget === "talkall") {
          pttTargetLabel.innerText = "TALK ALL";
          log("Target: Broadcast to All");
        } else {
          pttTargetLabel.innerText = btn.innerText.toUpperCase();
          log(`Target: Direct -> ${btn.innerText}`);
        }
      });
    });

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    function getAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function playChirp() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, ctx.currentTime);
        osc.frequency.setValueAtTime(2400, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.10);
        osc.start();
        osc.stop(ctx.currentTime + 0.10);
      } catch (e) {}
    }

    async function togglePower() {
      const ctx = getAudioContext();

      if (!isPoweredOn) {
        powerBtn.innerText = "CONNECTING...";
        powerBtn.disabled = true;

        log(`Powering up as ${myDisplayName}...`);

        try {
          await requestWakeLock();

          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });

          const source = ctx.createMediaStreamSource(micStream);
          micAnalyser = ctx.createAnalyser();
          micAnalyser.fftSize = 64;
          source.connect(micAnalyser);

          const dataArray = new Uint8Array(micAnalyser.frequencyBinCount);
          meterInterval = setInterval(() => {
            if (!isPoweredOn) return;
            micAnalyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let pct = Math.min(100, Math.round((avg / 128) * 100));

            if (isTransmitting) {
              meterBar.style.width = pct + "%";
              meterBar.style.backgroundColor = "#ef4444";
            } else {
              meterBar.style.width = "0%";
            }
          }, 50);

          const connectionClientId = `fr-${myId}-${Math.floor(1000 + Math.random() * 9000)}`;
          mqttClient = new Paho.MQTT.Client("broker.emqx.io", 8084, connectionClientId);

          mqttClient.onConnectionLost = (responseObject) => {
            if (responseObject.errorCode !== 0) {
              log("Link lost: " + responseObject.errorMessage);
              statusBadge.innerText = "OFFLINE";
              statusBadge.className = "status-badge";
            }
          };

          mqttClient.onMessageArrived = (message) => {
            handleIncomingRadioMessage(message);
          };

          mqttClient.connect({
            useSSL: true,
            timeout: 4,
            cleanSession: true,
            onSuccess: () => {
              isPoweredOn = true;
              powerBtn.innerText = "POWER OFF";
              powerBtn.className = "power-btn off";
              powerBtn.disabled = false;
              statusBadge.innerText = "ONLINE";
              statusBadge.className = "status-badge online";
              log("Radio connected.");

              mqttClient.subscribe("friendradio/channel/talkall");
              mqttClient.subscribe(`friendradio/direct/${myId}`);
              log(`Listening on ALL & private to ${myId}`);
            },
            onFailure: (err) => {
              log("Connection failed: " + err.errorMessage);
              powerBtn.innerText = "POWER ON RADIO";
              powerBtn.disabled = false;
            }
          });

        } catch (err) {
          alert("Microphone required: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
        if (meterInterval) clearInterval(meterInterval);
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (mqttClient && mqttClient.isConnected()) {
          mqttClient.disconnect();
        }
        isPoweredOn = false;
        powerBtn.innerText = "POWER ON RADIO";
        powerBtn.className = "power-btn";
        statusBadge.innerText = "RADIO OFF";
        statusBadge.className = "status-badge";
        meterBar.style.width = "0%";
        log("Radio powered down.");
      }
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting || !micStream) return;
      isTransmitting = true;
      audioChunks = [];
      getAudioContext();
      playChirp();

      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";

      let mimeType = "audio/webm;codecs=opus";
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = "audio/ogg;codecs=opus";
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "";
      }

      const options = mimeType ? { mimeType, audioBitsPerSecond: 16000 } : { audioBitsPerSecond: 16000 };
      mediaRecorder = new MediaRecorder(micStream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async () => {
        if (audioChunks.length === 0) return;
        
        const fullBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        const buffer = await fullBlob.arrayBuffer();
        const base64Data = arrayBufferToBase64(buffer);

        let topic = selectedTarget === "talkall" 
          ? "friendradio/channel/talkall" 
          : `friendradio/direct/${selectedTarget}`;

        const voiceMsg = new Paho.MQTT.Message(JSON.stringify({
          type: "VOICE_TRANSMISSION",
          sender: myId,
          senderName: myDisplayName,
          target: selectedTarget,
          data: base64Data
        }));
        voiceMsg.destinationName = topic;
        mqttClient.send(voiceMsg);
      };

      mediaRecorder.start();
    }

    function stopTransmit() {
      if (!isTransmitting) return;
      isTransmitting = false;

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }

      pttBtn.classList.remove("active");
      statusBadge.innerText = "ONLINE";
      statusBadge.className = "status-badge online";
      meterBar.style.width = "0%";
    }

    function handleIncomingRadioMessage(message) {
      try {
        const payload = JSON.parse(message.payloadString);
        if (payload.sender === myId) return;

        if (payload.type === "VOICE_TRANSMISSION") {
          const callType = payload.target === "talkall" ? "📢 [ALL]" : "🔒 [DIRECT]";
          statusBadge.innerText = `RX: ${payload.senderName.toUpperCase()}`;
          statusBadge.className = "status-badge rx";
          log(`${callType} from ${payload.senderName}`);
          
          playChirp();
          playVoicePayload(payload.data);
        }
      } catch (e) {}
    }

    async function playVoicePayload(base64Data) {
      try {
        const ctx = getAudioContext();
        const audioBytes = base64ToArrayBuffer(base64Data);
        
        const audioBuffer = await ctx.decodeAudioData(audioBytes);
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(ctx.destination);
        
        source.onended = () => {
          statusBadge.innerText = "ONLINE";
          statusBadge.className = "status-badge online";
        };

        source.start(0);
      } catch (err) {
        log("Playback error: " + err.message);
      }
    }

    function arrayBufferToBase64(buffer) {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binary_string = window.atob(base64);
      const len = binary_string.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
      }
      return bytes.buffer;
    }

    powerBtn.addEventListener("click", togglePower);

    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTransmit(); });

    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
</body>
</html>
