<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Direct Connect Walkie-Talkie</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px;
    }
    .header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: #58a6ff; text-align: center; }
    
    .screen {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 12px 16px;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 8px;
      background: #21262d;
      color: #8b949e;
    }
    .status-badge.tx { background: #da3633; color: #fff; }
    .status-badge.rx { background: #238636; color: #fff; animation: pulse 0.6s infinite alternate; }
    .status-badge.online { background: #1f6feb; color: #fff; }

    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1; }
    }

    .channel-select {
      background: #0d1117;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      font-weight: bold;
      outline: none;
      margin-bottom: 8px;
    }

    .meter-container {
      width: 100%;
      height: 10px;
      background: #0d1117;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #30363d;
    }
    .meter-bar {
      width: 0%;
      height: 100%;
      background: #3fb950;
      transition: width 0.05s ease;
    }

    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .ptt-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #30363d;
      background: radial-gradient(circle, #21262d 0%, #161b22 100%);
      color: #8b949e;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      touch-action: none;
      transition: all 0.1s ease;
    }
    .ptt-btn.active {
      border-color: #f85149;
      background: radial-gradient(circle, #da3633 0%, #b62324 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(218, 54, 51, 0.6);
      transform: scale(0.96);
    }

    .power-btn {
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      width: 100%;
      max-width: 360px;
      cursor: pointer;
    }
    .power-btn.off { background-color: #da3633; }

    .log-box {
      width: 100%;
      max-width: 360px;
      height: 80px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #3fb950;
      padding: 6px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DIRECT CONNECT</h1>
  </div>

  <div class="screen">
    <div id="statusBadge" class="status-badge">RADIO OFF</div>
    <select id="channelSelect" class="channel-select">
      <option value="sereno-ch1">CHANNEL 1 (Operations)</option>
      <option value="sereno-ch2">CHANNEL 2 (Maintenance)</option>
      <option value="sereno-ch3">CHANNEL 3 (Security)</option>
    </select>
    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">PTT</div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">Select Channel & Power On.</div>

  <script>
    const clientId = "radio-" + Math.floor(100000 + Math.random() * 900000);
    let mqttClient = null;
    let micStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let micAnalyser = null;
    let meterInterval = null;
    let isPoweredOn = false;
    let isTransmitting = false;
    let wakeLock = null;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const channelSelect = document.getElementById("channelSelect");
    const logBox = document.getElementById("logBox");
    const meterBar = document.getElementById("meterBar");

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    function getAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function playChirp() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, ctx.currentTime);
        osc.frequency.setValueAtTime(2400, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.10);
        osc.start();
        osc.stop(ctx.currentTime + 0.10);
      } catch (e) {}
    }

    async function togglePower() {
      const ctx = getAudioContext();

      if (!isPoweredOn) {
        powerBtn.innerText = "CONNECTING...";
        powerBtn.disabled = true;

        const channel = channelSelect.value;
        log(`Joining ${channel.toUpperCase()}...`);

        try {
          await requestWakeLock();

          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });

          // VU Meter Setup
          const source = ctx.createMediaStreamSource(micStream);
          micAnalyser = ctx.createAnalyser();
          micAnalyser.fftSize = 64;
          source.connect(micAnalyser);

          const dataArray = new Uint8Array(micAnalyser.frequencyBinCount);
          meterInterval = setInterval(() => {
            if (!isPoweredOn) return;
            micAnalyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let pct = Math.min(100, Math.round((avg / 128) * 100));

            if (isTransmitting) {
              meterBar.style.width = pct + "%";
              meterBar.style.backgroundColor = "#da3633";
            } else {
              meterBar.style.width = "0%";
            }
          }, 50);

          // Broker Connection
          mqttClient = new Paho.MQTT.Client("broker.emqx.io", 8084, clientId);

          mqttClient.onConnectionLost = (responseObject) => {
            if (responseObject.errorCode !== 0) {
              log("Link lost: " + responseObject.errorMessage);
              statusBadge.innerText = "OFFLINE";
              statusBadge.className = "status-badge";
            }
          };

          mqttClient.onMessageArrived = (message) => {
            handleIncomingRadioMessage(message);
          };

          mqttClient.connect({
            useSSL: true,
            timeout: 4,
            cleanSession: true,
            onSuccess: () => {
              isPoweredOn = true;
              powerBtn.innerText = "POWER OFF";
              powerBtn.className = "power-btn off";
              powerBtn.disabled = false;
              channelSelect.disabled = true;
              statusBadge.innerText = "ONLINE";
              statusBadge.className = "status-badge online";
              log(`Online ID: ${clientId}`);

              const topic = `serenodc/radio/${channel}`;
              mqttClient.subscribe(topic);
              log(`Channel ready: ${channel}`);
            },
            onFailure: (err) => {
              log("Broker error: " + err.errorMessage);
              powerBtn.innerText = "POWER ON RADIO";
              powerBtn.disabled = false;
            }
          });

        } catch (err) {
          alert("Microphone required: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
        if (meterInterval) clearInterval(meterInterval);
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (mqttClient && mqttClient.isConnected()) {
          mqttClient.disconnect();
        }
        isPoweredOn = false;
        powerBtn.innerText = "POWER ON RADIO";
        powerBtn.className = "power-btn";
        channelSelect.disabled = false;
        statusBadge.innerText = "RADIO OFF";
        statusBadge.className = "status-badge";
        meterBar.style.width = "0%";
        log("Radio powered down.");
      }
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting || !micStream) return;
      isTransmitting = true;
      audioChunks = [];
      getAudioContext();
      playChirp();

      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";

      let mimeType = "audio/webm;codecs=opus";
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = "audio/ogg;codecs=opus";
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "";
      }

      // 16 kbps Opus profile: high-clarity voice with ~80% smaller payload size
      const options = mimeType ? { mimeType, audioBitsPerSecond: 16000 } : { audioBitsPerSecond: 16000 };
      mediaRecorder = new MediaRecorder(micStream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async () => {
        if (audioChunks.length === 0) return;
        
        const fullBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        const buffer = await fullBlob.arrayBuffer();
        const base64Data = arrayBufferToBase64(buffer);

        const channel = channelSelect.value;
        const voiceMsg = new Paho.MQTT.Message(JSON.stringify({
          type: "VOICE_TRANSMISSION",
          sender: clientId,
          data: base64Data
        }));
        voiceMsg.destinationName = `serenodc/radio/${channel}`;
        mqttClient.send(voiceMsg);
      };

      mediaRecorder.start();
    }

    function stopTransmit() {
      if (!isTransmitting) return;
      isTransmitting = false;

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }

      pttBtn.classList.remove("active");
      statusBadge.innerText = "ONLINE";
      statusBadge.className = "status-badge online";
      meterBar.style.width = "0%";
    }

    function handleIncomingRadioMessage(message) {
      try {
        const payload = JSON.parse(message.payloadString);
        if (payload.sender === clientId) return;

        if (payload.type === "VOICE_TRANSMISSION") {
          statusBadge.innerText = "RECEIVING (RX)";
          statusBadge.className = "status-badge rx";
          playChirp();
          playVoicePayload(payload.data);
        }
      } catch (e) {}
    }

    async function playVoicePayload(base64Data) {
      try {
        const ctx = getAudioContext();
        const audioBytes = base64ToArrayBuffer(base64Data);
        
        const audioBuffer = await ctx.decodeAudioData(audioBytes);
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(ctx.destination);
        
        source.onended = () => {
          statusBadge.innerText = "ONLINE";
          statusBadge.className = "status-badge online";
        };

        source.start(0);
      } catch (err) {
        log("Playback err: " + err.message);
      }
    }

    function arrayBufferToBase64(buffer) {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binary_string = window.atob(base64);
      const len = binary_string.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
      }
      return bytes.buffer;
    }

    powerBtn.addEventListener("click", togglePower);

    // Mobile touch controls
    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTransmit(); });

    // Desktop controls
    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
</body>
</html>
