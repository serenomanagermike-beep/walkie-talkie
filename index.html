<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Friend Radio</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --accent-yellow: #eab308;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      background-color: var(--card-border);
      color: var(--accent-green);
    }

    .admin-btn {
      background-color: var(--accent-purple);
      color: white;
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    #alert-banner {
      display: none;
      width: 100%;
      max-width: 480px;
      background-color: var(--accent-yellow);
      color: #000;
      font-weight: 700;
      padding: 0.75rem;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 1rem;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Admin Panel */
    #admin-panel {
      display: none;
      width: 100%;
      max-width: 480px;
      background-color: #2e1065;
      border: 1px solid var(--accent-purple);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .admin-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .admin-action-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--card-border);
      color: var(--text-main);
    }

    /* User List */
    #peers-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex-grow: 1;
      margin-bottom: 1.5rem;
    }

    .user-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-green);
    }

    .user-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-icon {
      background: #334155;
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    .btn-icon:active {
      transform: scale(0.95);
    }

    .btn-ping {
      background: #7c2d12;
      color: #fdba74;
    }

    .btn-ping:active {
      background: #ea580c;
    }

    /* PTT Button */
    .ptt-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: center;
      padding: 1rem 0;
    }

    #ptt-button {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid var(--card-border);
      background: radial-gradient(circle, #334155 0%, #1e293b 100%);
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      transition: all 0.15s ease;
    }

    #ptt-button.transmitting {
      border-color: var(--accent-red);
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
      transform: scale(0.96);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    }
  </style>
</head>
<body>

  <header>
    <h1>📻 Friend Radio <span id="my-id-badge" class="badge">Connecting...</span></h1>
    <button id="admin-toggle-btn" class="admin-btn" onclick="toggleAdminPanel()">⚙️ ADMIN</button>
  </header>

  <div id="alert-banner"></div>

  <!-- Admin Controls Panel -->
  <div id="admin-panel">
    <div style="font-weight: 700; font-size: 0.9rem; color: #d8b4fe;">⚙️ Mesh Admin Controls</div>
    <div class="admin-actions">
      <button class="admin-action-btn" onclick="sendAdminBroadcast('RESET')">Force Clear Line</button>
      <button class="admin-action-btn" style="background:#dc2626;" onclick="sendAdminBroadcast('EMERGENCY_SIREN')">Emergency Siren</button>
    </div>
  </div>

  <!-- User Mesh List -->
  <div id="peers-container"></div>

  <!-- PTT Trigger -->
  <div class="ptt-container">
    <button id="ptt-button">
      <span>TALK</span>
      <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-dim);">PUSH & HOLD</span>
    </button>
  </div>

  <script>
    // URL Params & Identity
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user') || 'user-' + Math.floor(Math.random() * 1000);
    const isAdmin = ['laptop', 'mikey'].includes(userId.toLowerCase());

    document.getElementById('my-id-badge').textContent = userId;
    if (isAdmin) {
      document.getElementById('admin-toggle-btn').style.display = 'block';
    }

    // Audio Elements
    const screamAudio = new Audio('beavis-alert.mp3');
    screamAudio.preload = 'auto';

    // Unlock audio context on initial screen touch (Mobile Safari / Chrome bypass)
    window.addEventListener('pointerdown', () => {
      screamAudio.load();
    }, { once: true });

    function playBeavisScream() {
      try {
        screamAudio.currentTime = 0;
        screamAudio.volume = 1.0;
        const playPromise = screamAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(e => console.warn("Audio waiting for user gesture:", e));
        }
        if (navigator.vibrate) {
          navigator.vibrate([200, 100, 200, 100, 400]);
        }
      } catch (err) {
        console.error("Audio error:", err);
      }
    }

    function flashAlertBanner(text) {
      const banner = document.getElementById('alert-banner');
      banner.textContent = text;
      banner.style.display = 'block';
      setTimeout(() => { banner.style.display = 'none'; }, 5000);
    }

    // WebRTC Peer Mesh Setup
    const peer = new Peer(userId, {
      debug: 1
    });

    const connections = {};
    const calls = {};
    let localStream = null;

    // Get microphone access
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        localStream = stream;
        // Default mute until PTT pressed
        localStream.getAudioTracks().forEach(track => track.enabled = false);
      })
      .catch(err => console.error("Mic access denied:", err));

    peer.on('open', (id) => {
      console.log('Registered Peer ID:', id);
      renderUserList();
    });

    peer.on('connection', (conn) => {
      setupDataConnection(conn);
    });

    peer.on('call', (call) => {
      call.answer(localStream);
      call.on('stream', (remoteStream) => {
        playIncomingAudio(call.peer, remoteStream);
      });
    });

    function setupDataConnection(conn) {
      connections[conn.peer] = conn;
      conn.on('data', (data) => {
        handleIncomingData(data);
      });
      conn.on('close', () => {
        delete connections[conn.peer];
        renderUserList();
      });
      renderUserList();
    }

    function handleIncomingData(data) {
      const msg = typeof data === 'string' ? JSON.parse(data) : data;

      if (msg.type === 'DIRECT_PING') {
        playBeavisScream();
        flashAlertBanner(`⚡ Incoming Scream Alert from ${msg.from}!`);
      } else if (msg.type === 'EMERGENCY_SIREN') {
        playBeavisScream();
        flashAlertBanner(`🚨 EMERGENCY ALL-CALL FROM ${msg.from}`);
      } else if (msg.type === 'RESET') {
        location.reload();
      }
    }

    // Alert / Direct Ping
    function sendDirectPing(targetPeerId) {
      const payload = { type: 'DIRECT_PING', from: userId };
      
      if (connections[targetPeerId] && connections[targetPeerId].open) {
        connections[targetPeerId].send(JSON.stringify(payload));
      } else {
        const conn = peer.connect(targetPeerId);
        conn.on('open', () => {
          conn.send(JSON.stringify(payload));
        });
      }
      flashAlertBanner(`⚡ Alert sent to ${targetPeerId}`);
    }

    // Audio Output Player
    function playIncomingAudio(peerId, stream) {
      let audioEl = document.getElementById(`audio-${peerId}`);
      if (!audioEl) {
        audioEl = document.createElement('audio');
        audioEl.id = `audio-${peerId}`;
        audioEl.autoplay = true;
        document.body.appendChild(audioEl);
      }
      audioEl.srcObject = stream;
    }

    // PTT Transmit Control
    const pttBtn = document.getElementById('ptt-button');

    function startTransmitting() {
      if (!localStream) return;
      localStream.getAudioTracks().forEach(track => track.enabled = true);
      pttBtn.classList.add('transmitting');
    }

    function stopTransmitting() {
      if (!localStream) return;
      localStream.getAudioTracks().forEach(track => track.enabled = false);
      pttBtn.classList.remove('transmitting');
    }

    pttBtn.addEventListener('pointerdown', startTransmitting);
    pttBtn.addEventListener('pointerup', stopTransmitting);
    pttBtn.addEventListener('pointerleave', stopTransmitting);

    // Admin Toggle
    function toggleAdminPanel() {
      const panel = document.getElementById('admin-panel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function sendAdminBroadcast(type) {
      const payload = JSON.stringify({ type: type, from: userId });
      Object.values(connections).forEach(conn => {
        if (conn.open) conn.send(payload);
      });
      if (type === 'EMERGENCY_SIREN') playBeavisScream();
    }

    // UI Roster Render
    function renderUserList() {
      const container = document.getElementById('peers-container');
      const activePeers = Object.keys(connections);

      if (activePeers.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding:1rem;">Waiting for friends to join...</div>`;
        return;
      }

      container.innerHTML = activePeers.map(peerId => `
        <div class="user-card" id="card-${peerId}">
          <div class="user-info">
            <span class="status-dot"></span>
            <span style="font-weight:600;">${peerId}</span>
          </div>
          <div class="user-actions">
            <button class="btn-icon btn-ping" title="Send Beavis Alert" onclick="sendDirectPing('${peerId}')">⚡</button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
