<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Friend Radio</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#082f49" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Inter:wght@500;700;900&display=swap');

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(180deg, rgba(8, 47, 73, 0.25) 0%, rgba(12, 74, 110, 0.35) 100%),
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=85') center/cover no-repeat;
      background-attachment: fixed;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 12px 16px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      max-width: 380px;
      text-align: center;
      padding-top: 2px;
    }
    .header h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.55rem;
      letter-spacing: 4px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 16px rgba(56, 189, 248, 0.8);
    }
    .header .tagline {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.7rem;
      color: #fef08a;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 2px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    /* Screen Glass Panel */
    .screen {
      background: rgba(8, 47, 73, 0.85);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      padding: 12px;
      text-align: center;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 10px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 1px;
      background: rgba(15, 23, 42, 0.7);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
    }
    .status-badge.tx {
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.8);
      border-color: #f87171;
    }
    .status-badge.rx {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.8);
      animation: pulse 0.6s infinite alternate;
      border-color: #34d399;
    }
    .status-badge.online {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
      border-color: #38bdf8;
    }

    @keyframes pulse {
      from { opacity: 0.8; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    .user-pill {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fef08a;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(254, 240, 138, 0.4);
      padding: 5px 10px;
      border-radius: 10px;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .contacts-label {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.68rem;
      color: #bae6fd;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: left;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Beachy / Oceanic Tabs */
    .contacts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .contact-btn {
      background: linear-gradient(180deg, rgba(14, 116, 144, 0.85) 0%, rgba(21, 94, 117, 0.95) 100%);
      color: #e0f2fe;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 10px 8px;
      border-radius: 10px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
      transition: all 0.15s ease;
    }
    .contact-btn .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }
    .contact-btn:active {
      transform: scale(0.98);
    }
    .contact-btn.active {
      background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
      color: #ffffff;
      border-color: #7dd3fc;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }
    .contact-btn.active .indicator {
      background: #fef08a;
      box-shadow: 0 0 8px #fef08a;
    }
    .contact-btn.talkall {
      grid-column: span 2;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 11px 12px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.5);
    }
    .contact-btn.talkall .indicator {
      background: #fef08a;
      box-shadow: 0 0 8px #fef08a;
    }

    .meter-container {
      width: 100%;
      height: 7px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .meter-bar {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.05s ease;
    }

    /* Giant Thumbs-Up PTT Button */
    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }
    .ptt-btn {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      border: 6px solid #38bdf8;
      background: radial-gradient(circle at 35% 35%, #0ea5e9 0%, #0369a1 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65), 0 0 25px rgba(56, 189, 248, 0.5);
      cursor: pointer;
      touch-action: none;
      transition: all 0.12s ease;
      position: relative;
    }
    .ptt-btn svg {
      width: 82px;
      height: 82px;
      fill: #ffffff;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
      transition: transform 0.1s ease;
      pointer-events: none;
    }
    .ptt-btn span {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fef08a;
      margin-top: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    .ptt-btn.active {
      border-color: #ef4444;
      background: radial-gradient(circle at 35% 35%, #ef4444 0%, #991b1b 100%);
      box-shadow: 0 0 45px rgba(239, 68, 68, 0.9);
      transform: scale(0.95);
    }
    .ptt-btn.active svg {
      transform: scale(0.92);
      fill: #fee2e2;
    }
    .ptt-btn.active span {
      color: #ffffff;
    }

    /* Power Button */
    .power-btn {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: 1.5px solid #34d399;
      border-radius: 12px;
      padding: 13px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      width: 100%;
      max-width: 380px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.5);
      transition: all 0.15s ease;
    }
    .power-btn:active { transform: scale(0.98); }
    .power-btn.off {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      border-color: #f87171;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.5);
    }

    .log-box {
      width: 100%;
      max-width: 380px;
      height: 50px;
      background: rgba(8, 47, 73, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      font-family: ui-monospace, monospace;
      font-size: 0.68rem;
      color: #7dd3fc;
      padding: 6px 8px;
      overflow-y: auto;
      text-align: left;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>FRIEND RADIO</h1>
    <div class="tagline">Direct Connect PTT</div>
  </div>

  <div class="screen">
    <div class="status-row">
      <div id="statusBadge" class="status-badge">RADIO OFF</div>
      <div id="userTag" class="user-pill">USER: LOCKING...</div>
    </div>

    <div class="contacts-label">
      <span>Channels & Contacts</span>
      <span id="targetModeLabel" style="color: #fef08a;">BROADCAST</span>
    </div>

    <div class="contacts-grid">
      <button class="contact-btn talkall active" data-target="talkall">
        <span>📢 TALK ALL (BROADCAST)</span>
        <span class="indicator"></span>
      </button>
      <button class="contact-btn" data-target="jim">
        <span>CALIFORNIA JIM</span>
        <span class="indicator"></span>
      </button>
      <button class="contact-btn" data-target="edd">
        <span>EDD</span>
        <span class="indicator"></span>
      </button>
      <button class="contact-btn" data-target="matt">
        <span>MINNESOTA MATT</span>
        <span class="indicator"></span>
      </button>
      <button class="contact-btn" data-target="davey">
        <span>DAVEY</span>
        <span class="indicator"></span>
      </button>
      <button class="contact-btn" data-target="mikey">
        <span>MIKEY</span>
        <span class="indicator"></span>
      </button>
      <button class="contact-btn" data-target="work">
        <span>WORK TEST PHONE</span>
        <span class="indicator"></span>
      </button>
    </div>

    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">
      <svg viewBox="0 0 24 24">
        <path d="M23 10a2 2 0 0 0-2-2h-6.32l.96-4.57c.02-.1.03-.21.03-.32 0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10a2 2 0 0 0 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2zM1 21h4V9H1v12z"/>
      </svg>
      <span id="pttTargetLabel">TALK ALL</span>
    </div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">Tap Power On to connect.</div>

  <script>
    const userMap = {
      "jim": "California Jim",
      "edd": "Edd",
      "matt": "Minnesota Matt",
      "davey": "Davey",
      "mikey": "Mikey",
      "work": "Work Test Phone"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const urlUser = urlParams.get("user");
    
    let myId = urlUser || localStorage.getItem("fr_my_id") || "work";
    if (urlUser) {
      localStorage.setItem("fr_my_id", myId);
    }

    const myDisplayName = userMap[myId] || "Authorized User";
    document.getElementById("userTag").innerText = `🌴 ${myDisplayName.toUpperCase()}`;

    let selectedTarget = "talkall";
    let mqttClient = null;
    let micStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let micAnalyser = null;
    let meterInterval = null;
    let pingInterval = null;
    let isPoweredOn = false;
    let isTransmitting = false;
    let wakeLock = null;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const pttTargetLabel = document.getElementById("pttTargetLabel");
    const targetModeLabel = document.getElementById("targetModeLabel");
    const logBox = document.getElementById("logBox");
    const meterBar = document.getElementById("meterBar");
    const contactBtns = document.querySelectorAll(".contact-btn");

    contactBtns.forEach(btn => {
      if (btn.getAttribute("data-target") === myId) {
        btn.style.display = "none";
      }

      btn.addEventListener("click", () => {
        contactBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedTarget = btn.getAttribute("data-target");

        if (selectedTarget === "talkall") {
          pttTargetLabel.innerText = "TALK ALL";
          targetModeLabel.innerText = "BROADCAST";
          log("Target: Broadcast to All");
        } else {
          const contactName = userMap[selectedTarget] || selectedTarget;
          pttTargetLabel.innerText = contactName.toUpperCase();
          targetModeLabel.innerText = "DIRECT";
          log(`Target: Direct -> ${contactName}`);
        }
      });
    });

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    function getAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function playChirp() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, ctx.currentTime);
        osc.frequency.setValueAtTime(2400, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.08);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    async function togglePower() {
      const ctx = getAudioContext();

      if (!isPoweredOn) {
        powerBtn.innerText = "CONNECTING...";
        powerBtn.disabled = true;

        log(`Connecting ${myDisplayName}...`);

        try {
          await requestWakeLock();

          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });

          const source = ctx.createMediaStreamSource(micStream);
          micAnalyser = ctx.createAnalyser();
          micAnalyser.fftSize = 64;
          source.connect(micAnalyser);

          const dataArray = new Uint8Array(micAnalyser.frequencyBinCount);
          meterInterval = setInterval(() => {
            if (!isPoweredOn) return;
            micAnalyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let pct = Math.min(100, Math.round((avg / 128) * 100));

            if (isTransmitting) {
              meterBar.style.width = pct + "%";
              meterBar.style.backgroundColor = "#ef4444";
            } else {
              meterBar.style.width = "0%";
            }
          }, 50);

          connectBroker();

        } catch (err) {
          alert("Microphone required: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        shutdownRadio();
      }
    }

    function connectBroker() {
      const connectionClientId = `fr-${myId}-${Math.floor(1000 + Math.random() * 9000)}`;
      
      // High-speed US HiveMQ Gateway cluster with keepalive
      mqttClient = new Paho.MQTT.Client("broker.hivemq.com", 8884, connectionClientId);

      mqttClient.onConnectionLost = (responseObject) => {
        if (responseObject.errorCode !== 0 && isPoweredOn) {
          log("Re-establishing link...");
          statusBadge.innerText = "RECONNECTING";
          statusBadge.className = "status-badge";
          setTimeout(connectBroker, 1500);
        }
      };

      mqttClient.onMessageArrived = (message) => {
        handleIncomingRadioMessage(message);
      };

      mqttClient.connect({
        useSSL: true,
        timeout: 4,
        keepAliveInterval: 10,
        cleanSession: true,
        onSuccess: () => {
          isPoweredOn = true;
          powerBtn.innerText = "POWER OFF";
          powerBtn.className = "power-btn off";
          powerBtn.disabled = false;
          statusBadge.innerText = "ONLINE";
          statusBadge.className = "status-badge online";
          log("Fast link established.");

          mqttClient.subscribe("friendradio/channel/talkall");
          mqttClient.subscribe(`friendradio/direct/${myId}`);

          // Active background ping keep-alive
          if (pingInterval) clearInterval(pingInterval);
          pingInterval = setInterval(() => {
            if (mqttClient && mqttClient.isConnected()) {
              const ping = new Paho.MQTT.Message("P");
              ping.destinationName = "friendradio/ping";
              mqttClient.send(ping);
            }
          }, 10000);
        },
        onFailure: (err) => {
          log("Link failed. Retrying...");
          setTimeout(connectBroker, 2000);
        }
      });
    }

    function shutdownRadio() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
      if (pingInterval) clearInterval(pingInterval);
      if (meterInterval) clearInterval(meterInterval);
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (mqttClient && mqttClient.isConnected()) {
        mqttClient.disconnect();
      }
      isPoweredOn = false;
      powerBtn.innerText = "POWER ON RADIO";
      powerBtn.className = "power-btn";
      statusBadge.innerText = "RADIO OFF";
      statusBadge.className = "status-badge";
      meterBar.style.width = "0%";
      log("Radio powered down.");
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting || !micStream) return;
      isTransmitting = true;
      audioChunks = [];
      getAudioContext();
      playChirp();

      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";

      let mimeType = "audio/webm;codecs=opus";
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = "audio/ogg;codecs=opus";
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "";
      }

      // Ultra-lightweight 12 kbps Opus stream for minimal latency
      const options = mimeType ? { mimeType, audioBitsPerSecond: 12000 } : { audioBitsPerSecond: 12000 };
      mediaRecorder = new MediaRecorder(micStream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async () => {
        if (audioChunks.length === 0) return;
        
        const fullBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        const buffer = await fullBlob.arrayBuffer();
        const base64Data = arrayBufferToBase64(buffer);

        let topic = selectedTarget === "talkall" 
          ? "friendradio/channel/talkall" 
          : `friendradio/direct/${selectedTarget}`;

        const voiceMsg = new Paho.MQTT.Message(JSON.stringify({
          type: "VOICE_TRANSMISSION",
          sender: myId,
          senderName: myDisplayName,
          target: selectedTarget,
          data: base64Data
        }));
        voiceMsg.destinationName = topic;
        mqttClient.send(voiceMsg);
      };

      mediaRecorder.start();
    }

    function stopTransmit() {
      if (!isTransmitting) return;
      isTransmitting = false;

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }

      pttBtn.classList.remove("active");
      statusBadge.innerText = "ONLINE";
      statusBadge.className = "status-badge online";
      meterBar.style.width = "0%";
    }

    function handleIncomingRadioMessage(message) {
      try {
        if (message.destinationName === "friendradio/ping") return;
        const payload = JSON.parse(message.payloadString);
        if (payload.sender === myId) return;

        if (payload.type === "VOICE_TRANSMISSION") {
          const callType = payload.target === "talkall" ? "📢 [ALL]" : "🔒 [DIRECT]";
          statusBadge.innerText = `RX: ${payload.senderName.toUpperCase()}`;
          statusBadge.className = "status-badge rx";
          log(`${callType} from ${payload.senderName}`);
          
          playChirp();
          playVoicePayload(payload.data);
        }
      } catch (e) {}
    }

    async function playVoicePayload(base64Data) {
      try {
        const ctx = getAudioContext();
        const audioBytes = base64ToArrayBuffer(base64Data);
        
        const audioBuffer = await ctx.decodeAudioData(audioBytes);
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(ctx.destination);
        
        source.onended = () => {
          statusBadge.innerText = "ONLINE";
          statusBadge.className = "status-badge online";
        };

        source.start(0);
      } catch (err) {
        log("Playback error: " + err.message);
      }
    }

    function arrayBufferToBase64(buffer) {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binary_string = window.atob(base64);
      const len = binary_string.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
      }
      return bytes.buffer;
    }

    powerBtn.addEventListener("click", togglePower);

    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTransmit(); });

    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
