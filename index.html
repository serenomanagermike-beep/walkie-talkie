<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Friend Radio</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at top, #161f30 0%, #090d16 100%);
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px;
      overflow: hidden;
    }

    /* Radio Header */
    .header {
      width: 100%;
      max-width: 360px;
      text-align: center;
      padding-top: 4px;
    }
    .header h1 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .header .tagline {
      font-size: 0.72rem;
      color: #64748b;
      letter-spacing: 1.5px;
      margin-top: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* LCD Screen Chassis */
    .screen {
      background: #0b1120;
      border: 2px solid #1e293b;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8), 0 4px 16px rgba(0, 0, 0, 0.4);
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      padding: 14px;
      text-align: center;
      position: relative;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-bottom: 10px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .status-badge.tx {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.6);
      border-color: #f87171;
    }
    .status-badge.rx {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
      animation: pulse 0.6s infinite alternate;
      border-color: #34d399;
    }
    .status-badge.online {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
      border-color: #38bdf8;
    }

    @keyframes pulse {
      from { opacity: 0.7; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    /* Channel Selector */
    .channel-select {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      font-weight: 700;
      outline: none;
      margin-bottom: 10px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    .channel-select:disabled {
      color: #94a3b8;
      opacity: 0.8;
    }

    /* Audio Meter */
    .meter-container {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    .meter-bar {
      width: 0%;
      height: 100%;
      background: #10b981;
      transition: width 0.05s ease;
    }

    /* Center PTT Button */
    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .ptt-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 8px solid #1e293b;
      background: radial-gradient(circle at 35% 35%, #334155 0%, #0f172a 100%);
      color: #94a3b8;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.1);
      cursor: pointer;
      touch-action: none;
      transition: all 0.1s ease;
    }
    .ptt-btn span {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #64748b;
      margin-top: 2px;
    }
    .ptt-btn.active {
      border-color: #ef4444;
      background: radial-gradient(circle at 35% 35%, #ef4444 0%, #b91c1c 100%);
      color: #ffffff;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.7), inset 0 2px 6px rgba(255, 255, 255, 0.2);
      transform: scale(0.96);
    }
    .ptt-btn.active span {
      color: #fee2e2;
    }

    /* Power Button */
    .power-btn {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: 1px solid #34d399;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1px;
      width: 100%;
      max-width: 360px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.15s ease;
    }
    .power-btn:active {
      transform: scale(0.98);
    }
    .power-btn.off {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      border-color: #f87171;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    }

    /* Log Box */
    .log-box {
      width: 100%;
      max-width: 360px;
      height: 75px;
      background: #050811;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.72rem;
      color: #38bdf8;
      padding: 8px;
      overflow-y: auto;
      text-align: left;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>FRIEND RADIO</h1>
    <div class="tagline">Direct Connect PTT</div>
  </div>

  <div class="screen">
    <div id="statusBadge" class="status-badge">RADIO OFF</div>
    <select id="channelSelect" class="channel-select">
      <option value="friend-ch1">CHANNEL 1</option>
      <option value="friend-ch2">CHANNEL 2</option>
      <option value="friend-ch3">CHANNEL 3</option>
      <option value="friend-ch4">CHANNEL 4</option>
    </select>
    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">
      PTT
      <span>PUSH TO TALK</span>
    </div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">Select Channel & Tap Power On.</div>

  <script>
    const clientId = "fr-" + Math.floor(100000 + Math.random() * 900000);
    let mqttClient = null;
    let micStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let micAnalyser = null;
    let meterInterval = null;
    let isPoweredOn = false;
    let isTransmitting = false;
    let wakeLock = null;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const channelSelect = document.getElementById("channelSelect");
    const logBox = document.getElementById("logBox");
    const meterBar = document.getElementById("meterBar");

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    function getAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function playChirp() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, ctx.currentTime);
        osc.frequency.setValueAtTime(2400, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.10);
        osc.start();
        osc.stop(ctx.currentTime + 0.10);
      } catch (e) {}
    }

    async function togglePower() {
      const ctx = getAudioContext();

      if (!isPoweredOn) {
        powerBtn.innerText = "CONNECTING...";
        powerBtn.disabled = true;

        const channel = channelSelect.value;
        log(`Connecting to ${channel.toUpperCase()}...`);

        try {
          await requestWakeLock();

          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });

          // VU Meter Setup
          const source = ctx.createMediaStreamSource(micStream);
          micAnalyser = ctx.createAnalyser();
          micAnalyser.fftSize = 64;
          source.connect(micAnalyser);

          const dataArray = new Uint8Array(micAnalyser.frequencyBinCount);
          meterInterval = setInterval(() => {
            if (!isPoweredOn) return;
            micAnalyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let pct = Math.min(100, Math.round((avg / 128) * 100));

            if (isTransmitting) {
              meterBar.style.width = pct + "%";
              meterBar.style.backgroundColor = "#ef4444";
            } else {
              meterBar.style.width = "0%";
            }
          }, 50);

          // Connect to Broker
          mqttClient = new Paho.MQTT.Client("broker.emqx.io", 8084, clientId);

          mqttClient.onConnectionLost = (responseObject) => {
            if (responseObject.errorCode !== 0) {
              log("Link disconnected: " + responseObject.errorMessage);
              statusBadge.innerText = "OFFLINE";
              statusBadge.className = "status-badge";
            }
          };

          mqttClient.onMessageArrived = (message) => {
            handleIncomingRadioMessage(message);
          };

          mqttClient.connect({
            useSSL: true,
            timeout: 4,
            cleanSession: true,
            onSuccess: () => {
              isPoweredOn = true;
              powerBtn.innerText = "POWER OFF";
              powerBtn.className = "power-btn off";
              powerBtn.disabled = false;
              channelSelect.disabled = true;
              statusBadge.innerText = "ONLINE";
              statusBadge.className = "status-badge online";
              log(`Radio online: ${clientId}`);

              const topic = `friendradio/${channel}`;
              mqttClient.subscribe(topic);
              log(`Monitoring ${channel}`);
            },
            onFailure: (err) => {
              log("Connection error: " + err.errorMessage);
              powerBtn.innerText = "POWER ON RADIO";
              powerBtn.disabled = false;
            }
          });

        } catch (err) {
          alert("Microphone required: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
        if (meterInterval) clearInterval(meterInterval);
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (mqttClient && mqttClient.isConnected()) {
          mqttClient.disconnect();
        }
        isPoweredOn = false;
        powerBtn.innerText = "POWER ON RADIO";
        powerBtn.className = "power-btn";
        channelSelect.disabled = false;
        statusBadge.innerText = "RADIO OFF";
        statusBadge.className = "status-badge";
        meterBar.style.width = "0%";
        log("Radio powered off.");
      }
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting || !micStream) return;
      isTransmitting = true;
      audioChunks = [];
      getAudioContext();
      playChirp();

      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";

      let mimeType = "audio/webm;codecs=opus";
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = "audio/ogg;codecs=opus";
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "";
      }

      const options = mimeType ? { mimeType, audioBitsPerSecond: 16000 } : { audioBitsPerSecond: 16000 };
      mediaRecorder = new MediaRecorder(micStream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async () => {
        if (audioChunks.length === 0) return;
        
        const fullBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        const buffer = await fullBlob.arrayBuffer();
        const base64Data = arrayBufferToBase64(buffer);

        const channel = channelSelect.value;
        const voiceMsg = new Paho.MQTT.Message(JSON.stringify({
          type: "VOICE_TRANSMISSION",
          sender: clientId,
          data: base64Data
        }));
        voiceMsg.destinationName = `friendradio/${channel}`;
        mqttClient.send(voiceMsg);
      };

      mediaRecorder.start();
    }

    function stopTransmit() {
      if (!isTransmitting) return;
      isTransmitting = false;

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }

      pttBtn.classList.remove("active");
      statusBadge.innerText = "ONLINE";
      statusBadge.className = "status-badge online";
      meterBar.style.width = "0%";
    }

    function handleIncomingRadioMessage(message) {
      try {
        const payload = JSON.parse(message.payloadString);
        if (payload.sender === clientId) return;

        if (payload.type === "VOICE_TRANSMISSION") {
          statusBadge.innerText = "RECEIVING (RX)";
          statusBadge.className = "status-badge rx";
          playChirp();
          playVoicePayload(payload.data);
        }
      } catch (e) {}
    }

    async function playVoicePayload(base64Data) {
      try {
        const ctx = getAudioContext();
        const audioBytes = base64ToArrayBuffer(base64Data);
        
        const audioBuffer = await ctx.decodeAudioData(audioBytes);
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(ctx.destination);
        
        source.onended = () => {
          statusBadge.innerText = "ONLINE";
          statusBadge.className = "status-badge online";
        };

        source.start(0);
      } catch (err) {
        log("Playback error: " + err.message);
      }
    }

    function arrayBufferToBase64(buffer) {
      let binary = "";
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binary_string = window.atob(base64);
      const len = binary_string.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
      }
      return bytes.buffer;
    }

    powerBtn.addEventListener("click", togglePower);

    // Mobile touch
    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTransmit(); });

    // Desktop click
    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
</body>
</html>
