<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Direct Connect Walkie-Talkie</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px;
    }
    .header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: #58a6ff; text-align: center; }
    
    .screen {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 12px 16px;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 8px;
      background: #21262d;
      color: #8b949e;
    }
    .status-badge.tx { background: #da3633; color: #fff; }
    .status-badge.rx { background: #238636; color: #fff; }

    .channel-select {
      background: #0d1117;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      font-weight: bold;
      outline: none;
    }

    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .ptt-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #30363d;
      background: radial-gradient(circle, #21262d 0%, #161b22 100%);
      color: #8b949e;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      touch-action: none;
      transition: all 0.1s ease;
    }
    .ptt-btn.active {
      border-color: #f85149;
      background: radial-gradient(circle, #da3633 0%, #b62324 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(218, 54, 51, 0.6);
      transform: scale(0.96);
    }

    .power-btn {
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      width: 100%;
      max-width: 360px;
      cursor: pointer;
    }
    .power-btn.off { background-color: #da3633; }

    .log-box {
      width: 100%;
      max-width: 360px;
      height: 80px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #3fb950;
      padding: 6px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DIRECT CONNECT</h1>
  </div>

  <div class="screen">
    <div id="statusBadge" class="status-badge">RADIO OFF</div>
    <select id="channelSelect" class="channel-select">
      <option value="room-alpha-direct">CHANNEL 1</option>
      <option value="room-bravo-direct">CHANNEL 2</option>
      <option value="room-charlie-direct">CHANNEL 3</option>
    </select>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">PTT</div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">System ready. Tap Power On.</div>

  <div id="audioContainer"></div>

  <script>
    const myId = "ptt-" + Math.floor(Math.random() * 899999 + 100000);
    let peer = null;
    let rawMicStream = null;
    let outboundStream = null;
    let pttGainNode = null;
    let audioCtx = null;
    let activeCalls = {};
    let isPoweredOn = false;
    let isTransmitting = false;
    let syncInterval = null;
    let eventSource = null;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const channelSelect = document.getElementById("channelSelect");
    const logBox = document.getElementById("logBox");
    const audioContainer = document.getElementById("audioContainer");

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    function initAudioPipeline(stream) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const micSource = audioCtx.createMediaStreamSource(stream);
      pttGainNode = audioCtx.createGain();
      
      // Default to 0 gain (Standby/RX mode - muted but pipeline stays hot)
      pttGainNode.gain.setValueAtTime(0, audioCtx.currentTime);

      const destination = audioCtx.createMediaStreamDestination();
      micSource.connect(pttGainNode);
      pttGainNode.connect(destination);

      outboundStream = destination.stream;
    }

    function playChirp() {
      try {
        if (!audioCtx) return;
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(2400, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    async function togglePower() {
      if (!isPoweredOn) {
        powerBtn.innerText = "CONNECTING...";
        powerBtn.disabled = true;
        log("Accessing microphone...");

        try {
          rawMicStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: false
          });

          // Build continuous gain pipeline
          initAudioPipeline(rawMicStream);
          log("Audio pipeline locked (RX).");

          peer = new Peer(myId, {
            debug: 1,
            config: {
              iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" }
              ],
              iceCandidatePoolSize: 10
            }
          });

          peer.on("open", (id) => {
            isPoweredOn = true;
            powerBtn.innerText = "POWER OFF";
            powerBtn.className = "power-btn off";
            powerBtn.disabled = false;
            channelSelect.disabled = true;
            statusBadge.innerText = "RX STANDBY";
            statusBadge.className = "status-badge rx";
            log("Online ID: " + id);

            joinChannelMesh();
          });

          peer.on("call", (call) => {
            log("Inbound call from: " + call.peer);
            call.answer(outboundStream);
            attachAudioStream(call);
          });

          peer.on("error", (err) => {
            log("Radio ERR: " + err.type);
            console.error("PeerJS Error:", err);
          });

          peer.on("disconnected", () => {
            log("Signaling lost. Reconnecting...");
            if (peer && !peer.destroyed) peer.reconnect();
          });

        } catch (err) {
          alert("Microphone required: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        if (syncInterval) clearInterval(syncInterval);
        if (eventSource) eventSource.close();
        if (rawMicStream) {
          rawMicStream.getTracks().forEach(track => track.stop());
          rawMicStream = null;
        }
        if (audioCtx) {
          audioCtx.close();
          audioCtx = null;
        }
        if (peer) peer.destroy();
        audioContainer.innerHTML = "";
        activeCalls = {};
        isPoweredOn = false;
        powerBtn.innerText = "POWER ON RADIO";
        powerBtn.className = "power-btn";
        channelSelect.disabled = false;
        statusBadge.innerText = "RADIO OFF";
        statusBadge.className = "status-badge";
        log("Radio powered down.");
      }
    }

    function attachAudioStream(call) {
      activeCalls[call.peer] = call;

      call.on("stream", (remoteStream) => {
        let audio = document.getElementById("audio-" + call.peer);
        if (!audio) {
          audio = document.createElement("audio");
          audio.id = "audio-" + call.peer;
          audio.autoplay = true;
          audio.setAttribute("playsinline", "true");
          audioContainer.appendChild(audio);
        }
        
        audio.srcObject = remoteStream;
        
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              log("Live RX link: " + call.peer);
            })
            .catch(() => {
              log("Audio blocked. Tap anywhere.");
              const unlock = () => {
                audio.play();
                document.removeEventListener("click", unlock);
                document.removeEventListener("touchstart", unlock);
              };
              document.addEventListener("click", unlock);
              document.addEventListener("touchstart", unlock);
            });
        }
      });

      if (call.peerConnection) {
        call.peerConnection.oniceconnectionstatechange = () => {
          const state = call.peerConnection.iceConnectionState;
          if (state === "failed" || state === "disconnected") {
            log("Link " + state + " with " + call.peer);
          }
        };
      }

      call.on("close", () => {
        const el = document.getElementById("audio-" + call.peer);
        if (el) el.remove();
        delete activeCalls[call.peer];
      });

      call.on("error", () => {
        log("Call err: " + call.peer);
      });
    }

    function joinChannelMesh() {
      const room = channelSelect.value;
      const syncUrl = `https://ntfy.sh/directconnect-${room}`;

      fetch(`${syncUrl}/publish`, {
        method: "POST",
        body: JSON.stringify({ action: "join", id: myId })
      }).catch(() => {});

      if (eventSource) eventSource.close();
      eventSource = new EventSource(`${syncUrl}/sse`);
      
      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const message = JSON.parse(data.message);
          
          if (message.id && message.id !== myId && message.action === "join") {
            if (!activeCalls[message.id] && myId > message.id) {
              log("Calling peer: " + message.id);
              const call = peer.call(message.id, outboundStream);
              if (call) attachAudioStream(call);
            }
          }
        } catch (e) {}
      };

      syncInterval = setInterval(() => {
        if (!isPoweredOn) return;
        fetch(`${syncUrl}/publish`, {
          method: "POST",
          body: JSON.stringify({ action: "join", id: myId })
        }).catch(() => {});
      }, 8000);
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting || !pttGainNode || !audioCtx) return;
      isTransmitting = true;
      if (audioCtx.state === "suspended") audioCtx.resume();
      
      playChirp();
      
      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";

      // Ramp gain up smoothly to avoid clicking
      pttGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      pttGainNode.gain.setTargetAtTime(1.0, audioCtx.currentTime, 0.02);
      log("TX Active (Audio Live)");
    }

    function stopTransmit() {
      if (!isTransmitting || !pttGainNode || !audioCtx) return;
      isTransmitting = false;
      
      pttBtn.classList.remove("active");
      statusBadge.innerText = "RX STANDBY";
      statusBadge.className = "status-badge rx";

      // Ramp gain back to 0
      pttGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      pttGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.02);
      log("RX Standby (Muted)");
    }

    powerBtn.addEventListener("click", togglePower);

    pttBtn.addEventListener("touchstart", (e) => { 
      e.preventDefault(); 
      startTransmit(); 
    });
    pttBtn.addEventListener("touchend", (e) => { 
      e.preventDefault(); 
      stopTransmit(); 
    });

    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
</body>
</html>
