<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Direct Connect Walkie-Talkie</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px;
    }
    .header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: #58a6ff; text-align: center; }
    
    .screen {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 12px 16px;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 8px;
      background: #21262d;
      color: #8b949e;
    }
    .status-badge.tx { background: #da3633; color: #fff; }
    .status-badge.rx { background: #238636; color: #fff; }
    .status-badge.standby { background: #1f6feb; color: #fff; }

    .channel-select {
      background: #0d1117;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      font-weight: bold;
      outline: none;
      margin-bottom: 8px;
    }

    .meter-container {
      width: 100%;
      height: 10px;
      background: #0d1117;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #30363d;
    }
    .meter-bar {
      width: 0%;
      height: 100%;
      background: #3fb950;
      transition: width 0.05s ease;
    }

    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .ptt-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #30363d;
      background: radial-gradient(circle, #21262d 0%, #161b22 100%);
      color: #8b949e;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      touch-action: none;
      transition: all 0.1s ease;
    }
    .ptt-btn.active {
      border-color: #f85149;
      background: radial-gradient(circle, #da3633 0%, #b62324 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(218, 54, 51, 0.6);
      transform: scale(0.96);
    }

    .power-btn {
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      width: 100%;
      max-width: 360px;
      cursor: pointer;
    }
    .power-btn.off { background-color: #da3633; }

    .log-box {
      width: 100%;
      max-width: 360px;
      height: 80px;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #3fb950;
      padding: 6px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DIRECT CONNECT</h1>
  </div>

  <div class="screen">
    <div id="statusBadge" class="status-badge">RADIO OFF</div>
    <select id="channelSelect" class="channel-select">
      <option value="ch1-alpha">CHANNEL 1</option>
      <option value="ch2-bravo">CHANNEL 2</option>
      <option value="ch3-charlie">CHANNEL 3</option>
    </select>
    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>
  </div>

  <div class="ptt-container">
    <div id="pttButton" class="ptt-btn">PTT</div>
  </div>

  <button id="powerBtn" class="power-btn">POWER ON RADIO</button>
  
  <div id="logBox" class="log-box">System ready. Tap Power On.</div>

  <!-- Permanent Audio Sink -->
  <audio id="speakerOutput" autoplay playsinline></audio>

  <script>
    // Unique peer identity per session
    const sessionId = Math.floor(100000 + Math.random() * 900000);
    const myPeerId = "dc-radio-" + sessionId;
    
    let peer = null;
    let micStream = null;
    let audioContext = null;
    let micAnalyser = null;
    let meterInterval = null;
    let syncTimer = null;
    let eventSource = null;
    let isPoweredOn = false;
    let isTransmitting = false;

    // Track active connection
    let connectedPeerId = null;
    let activeMediaCall = null;
    let activeDataConn = null;

    const powerBtn = document.getElementById("powerBtn");
    const pttBtn = document.getElementById("pttButton");
    const statusBadge = document.getElementById("statusBadge");
    const channelSelect = document.getElementById("channelSelect");
    const logBox = document.getElementById("logBox");
    const meterBar = document.getElementById("meterBar");
    const speakerOutput = document.getElementById("speakerOutput");

    function log(msg) {
      logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    // Audio Context Initializer & Nextel Chirp
    function getAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    function playChirp() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1800, ctx.currentTime);
        osc.frequency.setValueAtTime(2400, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.12);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    async function togglePower() {
      const ctx = getAudioContext();

      // Unlock mobile audio element immediately on user touch
      speakerOutput.muted = true;
      speakerOutput.play().catch(() => {});

      if (!isPoweredOn) {
        powerBtn.innerText = "STARTING RADIO...";
        powerBtn.disabled = true;
        log("Accessing microphone hardware...");

        try {
          // 1. Raw unconstrained microphone access
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          
          // 2. Setup Mic VU Meter
          const source = ctx.createMediaStreamSource(micStream);
          micAnalyser = ctx.createAnalyser();
          micAnalyser.fftSize = 64;
          source.connect(micAnalyser);

          const dataArray = new Uint8Array(micAnalyser.frequencyBinCount);
          meterInterval = setInterval(() => {
            if (!isPoweredOn) return;
            micAnalyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let pct = Math.min(100, Math.round((avg / 128) * 100));

            if (isTransmitting) {
              meterBar.style.width = pct + "%";
              meterBar.style.backgroundColor = "#da3633";
            } else {
              meterBar.style.width = "0%";
            }
          }, 50);

          log("Microphone online. Initializing mesh...");

          // 3. Setup PeerJS
          peer = new Peer(myPeerId, {
            debug: 1,
            config: {
              iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" }
              ],
              iceCandidatePoolSize: 10
            }
          });

          peer.on("open", (id) => {
            isPoweredOn = true;
            powerBtn.innerText = "POWER OFF";
            powerBtn.className = "power-btn off";
            powerBtn.disabled = false;
            channelSelect.disabled = true;
            statusBadge.innerText = "STANDBY";
            statusBadge.className = "status-badge standby";
            log("Radio Online: " + id);

            startSignalingMesh();
          });

          // Incoming WebRTC Voice Call
          peer.on("call", (call) => {
            log("Audio link requested by: " + call.peer);
            activeMediaCall = call;
            call.answer(micStream);
            
            call.on("stream", (remoteStream) => {
              log("Remote stream established.");
              speakerOutput.srcObject = remoteStream;
              speakerOutput.muted = true; // Stay silent until peer presses PTT
              speakerOutput.volume = 1.0;
              speakerOutput.play().catch(() => {});
            });

            call.on("close", () => {
              log("Audio link closed.");
              activeMediaCall = null;
            });
          });

          // Incoming WebRTC Data Connection (PTT Trigger)
          peer.on("connection", (conn) => {
            activeDataConn = conn;
            bindDataEvents(conn);
          });

          peer.on("error", (err) => {
            log("Peer error: " + err.type);
          });

        } catch (err) {
          alert("Mic Permission Denied: " + err.message);
          powerBtn.innerText = "POWER ON RADIO";
          powerBtn.disabled = false;
        }
      } else {
        // Power Down
        if (syncTimer) clearInterval(syncTimer);
        if (meterInterval) clearInterval(meterInterval);
        if (eventSource) eventSource.close();
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (peer) peer.destroy();
        speakerOutput.srcObject = null;
        activeMediaCall = null;
        activeDataConn = null;
        isPoweredOn = false;
        powerBtn.innerText = "POWER ON RADIO";
        powerBtn.className = "power-btn";
        channelSelect.disabled = false;
        statusBadge.innerText = "RADIO OFF";
        statusBadge.className = "status-badge";
        meterBar.style.width = "0%";
        log("Radio powered down.");
      }
    }

    function bindDataEvents(conn) {
      conn.on("open", () => {
        log("Direct link ready: " + conn.peer);
      });

      conn.on("data", (data) => {
        if (data === "TX_ON") {
          speakerOutput.muted = false;
          playChirp();
          statusBadge.innerText = "RECEIVING (RX)";
          statusBadge.className = "status-badge rx";
          log("Receiving audio...");
        } else if (data === "TX_OFF") {
          speakerOutput.muted = true;
          statusBadge.innerText = "STANDBY";
          statusBadge.className = "status-badge standby";
          log("Transmission ended.");
        }
      });

      conn.on("close", () => {
        activeDataConn = null;
      });
    }

    function startSignalingMesh() {
      const channel = channelSelect.value;
      const syncTopic = `https://ntfy.sh/directconnect-${channel}`;

      // Announce Presence
      const announce = () => {
        fetch(`${syncTopic}/publish`, {
          method: "POST",
          body: JSON.stringify({ id: myPeerId, time: Date.now() })
        }).catch(() => {});
      };

      announce();

      if (eventSource) eventSource.close();
      eventSource = new EventSource(`${syncTopic}/sse`);

      eventSource.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          const data = JSON.parse(payload.message);

          // Only react to other radios that announced in the last 15 seconds
          if (data.id && data.id !== myPeerId && (Date.now() - data.time < 15000)) {
            // Master/Slave handshake based on peer ID string comparison
            if (!activeMediaCall && myPeerId > data.id) {
              log("Calling peer: " + data.id);
              
              // 1. Establish Media Stream
              const call = peer.call(data.id, micStream);
              activeMediaCall = call;
              call.on("stream", (remoteStream) => {
                log("Remote audio locked.");
                speakerOutput.srcObject = remoteStream;
                speakerOutput.muted = true;
                speakerOutput.volume = 1.0;
                speakerOutput.play().catch(() => {});
              });

              // 2. Establish Data Connection for PTT signaling
              const conn = peer.connect(data.id);
              activeDataConn = conn;
              bindDataEvents(conn);
            }
          }
        } catch (e) {}
      };

      syncTimer = setInterval(() => {
        if (isPoweredOn) announce();
      }, 7000);
    }

    function startTransmit() {
      if (!isPoweredOn || isTransmitting) return;
      isTransmitting = true;
      getAudioContext();
      playChirp();

      pttBtn.classList.add("active");
      statusBadge.innerText = "TRANSMITTING (TX)";
      statusBadge.className = "status-badge tx";

      if (activeDataConn && activeDataConn.open) {
        activeDataConn.send("TX_ON");
      }
      log("TX Live - Speaking");
    }

    function stopTransmit() {
      if (!isTransmitting) return;
      isTransmitting = false;

      pttBtn.classList.remove("active");
      statusBadge.innerText = "STANDBY";
      statusBadge.className = "status-badge standby";

      if (activeDataConn && activeDataConn.open) {
        activeDataConn.send("TX_OFF");
      }
      meterBar.style.width = "0%";
      log("Standby");
    }

    powerBtn.addEventListener("click", togglePower);

    // Mobile touch events
    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTransmit(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTransmit(); });

    // Desktop mouse events
    pttBtn.addEventListener("mousedown", startTransmit);
    pttBtn.addEventListener("mouseup", stopTransmit);
  </script>
</body>
</html>
